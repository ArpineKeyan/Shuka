# Netlify builds the website from the client folder.
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

# Send API calls to the backend on Render. The browser only ever sees the Netlify address,
# so the login cookie works on every browser, including Safari on iPhone.
# Replace YOUR-RENDER-APP with your Render service name at deploy time.
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-RENDER-APP.onrender.com/api/:splat"
  status = 200
  force = true

# Every other page is handled by the React app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
